workflows:
  android-native-workflow:
    name: Android Native Build
    max_build_duration: 60
    environment:
      android_signing:
        - release_keystore # لو عندك شهادة توقيع، شيل التعليق أو سيبها لو هتبني Debug
      groups:
        - keystore_credentials # لو بتعمل Build للرسمي (Release)
      vars:
        PACKAGE_NAME: "com.example.myapp" # <--- غيّرها لاسم الـ Package بتاعك
    scripts:
      - name: Build Android APK
        script: |
          # إعطاء صلاحيات التنفيذ لملف الجرادل
          chmod +x gradlew
          
          # بناء ملف APK النسخة التجريبية (Debug)
          ./gradlew assembleDebug
          
          # لو عايز تبني نسخة الإصدار (Release) استخدم الأمر ده بدل اللي فوق:
          # ./gradlew assembleRelease
    artifacts:
      - build/outputs/apk/debug/app-debug.apk
      # لو بتعمل Release، غير المسار لـ:
      # - build/outputs/apk/release/app-release.apk
